<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>VYBE — dočasně nedostupné</title>
<style>
:root{color-scheme:light;--ink:#34383d;--muted:#747985;--line:#eceef1;--accent:#3978b8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.page{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:clamp(54px,12vh,120px) 25px 34px;text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:48px}
.mark{width:70px;height:70px;border:3px solid var(--accent);border-radius:23px;display:grid;place-items:center;color:var(--accent);font-size:37px;font-weight:900;letter-spacing:-3px;transform:rotate(-5deg)}
.wordmark{font-size:clamp(38px,10vw,53px);font-weight:900;letter-spacing:-2.8px;color:var(--accent)}
.headline{max-width:650px;margin:0;font-size:clamp(27px,6.2vw,40px);line-height:1.2;letter-spacing:-1.2px;font-weight:900;text-transform:uppercase}
.subtitle{margin:68px 0 0;color:var(--muted);font-size:clamp(19px,4.4vw,27px);line-height:1.45;font-weight:450}
.description{max-width:760px;margin:54px 0 0;color:var(--muted);font-size:clamp(18px,4.1vw,25px);line-height:1.55;font-weight:400}
.status{display:inline-flex;align-items:center;gap:9px;margin-top:34px;padding:10px 16px;border:1px solid var(--line);border-radius:999px;color:#555b64;font-size:14px;font-weight:650;background:#fafafa}
.status-dot{width:8px;height:8px;border-radius:50%;background:#e1ad38;box-shadow:0 0 0 4px #f9f1dc}
.footer{margin-top:auto;padding-top:70px;color:#a0a4ab;font-size:13px}
@media(max-width:420px){.page{padding-top:10vh}.brand{margin-bottom:42px}.subtitle{margin-top:54px}.description{margin-top:42px}.footer{padding-top:55px}}
</style>
</head>
<body>
<main class="page">
  <div class="brand" aria-label="VYBE">
    <div class="mark" aria-hidden="true">v.</div>
    <div class="wordmark">VYBE</div>
  </div>
  <h1 class="headline">Aplikace je dočasně<br>nedostupná</h1>
  <p class="subtitle">Omlouváme se, řešíme technický výpadek</p>
  <p class="description">VYBE teď kvůli technickým potížím nefunguje. Na obnovení provozu intenzivně pracujeme. Zkuste to prosím později. Děkujeme za trpělivost.</p>
  <div class="status"><span class="status-dot" aria-hidden="true"></span>Na opravě se pracuje</div>
  <footer class="footer">VYBE · Spojujeme lidi</footer>
</main>
</body>
</html>
